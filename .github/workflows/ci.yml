name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go build ./...
      - run: go vet ./...
      # The protocol's TypeScript declarations are generated from the Go types
      # that define it. A change to one without the other makes tau and the npm
      # host shim disagree, with nothing failing to compile on either side.
      - name: check generated protocol declarations
        run: go run ./cmd/gen-wire-ts -check
      - run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
